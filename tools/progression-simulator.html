<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPG GYM - Simulador de Progressão</title><style>body{font:15px system-ui;background:#0d0d12;color:#eee;max-width:980px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}.note{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}.card{background:#17171f;border:1px solid #292936;border-radius:16px;padding:18px}.big{font-size:32px;font-weight:800}.warn{color:#ffca6b}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{padding:10px;border-bottom:1px solid #292936;text-align:right}td:first-child,th:first-child{text-align:left}code{background:#20202a;padding:2px 6px;border-radius:6px}</style></head><body><h1>Simulador de progressão</h1><p class="note">Ferramenta de desenvolvimento. Não faz parte da interface do jogador.</p><div id="cards" class="grid"></div><table><thead><tr><th>Perfil</th><th>XP/semana</th><th>Global 12 sem</th><th>Global 26 sem</th><th>Global 52 sem</th></tr></thead><tbody id="rows"></tbody></table><p class="warn" id="warning"></p><script src="../js/config/balance-config.js"></script><script src="progression-simulator.js"></script></body></html>
